<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      id="hljs-theme"
      rel="stylesheet"
      href="./vendor/highlight.js/styles/github.min.css"
    />
    <script>
      window.__mdViewerShowFiles = function (files) {
        window.__mdViewerPendingFiles = files;
        if (typeof window.mdViewerRender === "function") {
          window.mdViewerRender(files);
        } else {
          document.dispatchEvent(
            new CustomEvent("mdviewer:files", { detail: files })
          );
        }
      };
    </script>
  </head>
  <body>
    <main id="app">
      <header class="header">
        <span id="title">MD Viewer</span>
        <button id="theme-toggle" type="button" aria-label="Toggle theme">
          Dark
        </button>
      </header>
      <article id="content">
        <p class="placeholder">Open a Markdown file to view it.</p>
      </article>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
